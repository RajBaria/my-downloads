<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajkumar Baria - My Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .file-icon-pdf { color: #ef4444; }
        .file-icon-apk { color: #10b981; }
        .file-icon-zip { color: #f59e0b; }
        .file-icon-img { color: #3b82f6; }
    </style>
</head>
<body class="text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="glass-card rounded-2xl p-6 md:p-10 mb-8 flex flex-col md:flex-row items-center justify-between">
            <div class="flex items-center flex-col md:flex-row gap-6">
                <div class="w-24 h-24 bg-gradient-to-tr from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white text-4xl font-bold shadow-lg shadow-blue-500/30">
                    RB
                </div>
                <div class="text-center md:text-left">
                    <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">Rajkumar Baria</h1>
                    <p class="text-gray-600 text-lg">Welcome to my personal file repository. You can download my shared files here.</p>
                </div>
            </div>
            <div class="mt-6 md:mt-0 flex gap-4">
                <a href="#" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-blue-600 hover:bg-blue-50 transition shadow-sm border border-gray-200">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-sky-500 hover:bg-sky-50 transition shadow-sm border border-gray-200">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-pink-600 hover:bg-pink-50 transition shadow-sm border border-gray-200">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </header>

        <main>
            <div class="flex items-center justify-between mb-6 px-2">
                <h2 class="text-2xl font-semibold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-folder-open text-blue-500"></i> Available Downloads
                </h2>
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full" id="fileCount">0 Files</span>
            </div>

            <!-- File List Container -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="fileContainer">
                <!-- Files will be injected here by JavaScript -->
            </div>
        </main>

        <footer class="mt-12 text-center text-gray-500 text-sm pb-8">
            <p>&copy; <span id="year"></span> Rajkumar Baria. All rights reserved.</p>
            <p class="mt-1">Designed for easy file sharing.</p>
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // તમારી અપલોડ કરેલી ફાઈલ અહી ઉમેરી છે
        const files = [
            {
                name: "Helical Solar System.apk",
                description: "Solar System 3D Android App",
                size: "15.6 MB",
                date: "Sept 2026",
                icon: "fa-android",
                iconClass: "file-icon-apk",
                url: "https://github.com/RajBaria/my-downloads/raw/refs/heads/main/Helical%20Solar%20System.apk"
            }
        ];

        document.getElementById('fileCount').textContent = `${files.length} Files`;

        const container = document.getElementById('fileContainer');

        if (files.length === 0) {
            // જો લિસ્ટ ખાલી હોય તો આ મેસેજ દેખાશે
            container.innerHTML = `
                <div class="col-span-1 md:col-span-2 text-center py-16 opacity-80">
                    <i class="fas fa-folder-open text-gray-300 text-6xl mb-4"></i>
                    <h3 class="text-xl text-gray-600 font-semibold">હાલમાં કોઈ ફાઈલ ઉપલબ્ધ નથી</h3>
                    <p class="text-gray-400 mt-2">જ્યારે નવી ફાઈલ ઉમેરવામાં આવશે ત્યારે તે અહીં દેખાશે.</p>
                </div>
            `;
        } else {
            files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-xl p-5 flex items-start gap-4 transition-transform hover:-translate-y-1 hover:shadow-lg duration-300 group';
                
                card.innerHTML = `
                    <div class="w-14 h-14 rounded-lg bg-white shadow-sm border border-gray-100 flex items-center justify-center shrink-0">
                        <i class="fas ${file.icon} text-3xl ${file.iconClass}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-lg font-bold text-gray-900 truncate" title="${file.name}">${file.name}</h3>
                        <p class="text-sm text-gray-500 mb-2 truncate">${file.description}</p>
                        <div class="flex items-center gap-3 text-xs text-gray-400 font-medium">
                            <span class="flex items-center gap-1"><i class="fas fa-database"></i> ${file.size}</span>
                            <span class="flex items-center gap-1"><i class="far fa-calendar-alt"></i> ${file.date}</span>
                        </div>
                    </div>
                    <a href="${file.url}" download="${file.name}" class="shrink-0 w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-600 hover:text-white transition-colors cursor-pointer border border-blue-100 group-hover:border-blue-600 group-hover:shadow-md">
                        <i class="fas fa-download"></i>
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // આ ફંક્શન માત્ર ડેમો માટે ખાલી ફાઈલ ડાઉનલોડ કરાવશે.
        // રિયલ વેબસાઈટમાં તમારે બટનની અંદર સીધી <a href="તમારી_ફાઈલની_લિંક" download> વાપરવાની રહેશે.
        function downloadDemoFile(filename, type) {
            // Create some dummy content for the demo download
            let content = `This is a demo file generated for ${filename}.\nIn a real website, this will be your actual file!`;
            
            // Create a Blob from the content
            const blob = new Blob([content], { type: 'text/plain' });
            
            // Create an object URL
            const url = window.URL.createObjectURL(blob);
            
            // Create a temporary anchor element and trigger download
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            
            document.body.appendChild(a);
            a.click();
            
            // Clean up
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

            // Show a custom styled message (instead of alert)
            showToast(`Downloading ${filename}...`);
        }

        // Custom Toast Message Function (Since alerts are not allowed)
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl flex items-center gap-3 transition-opacity duration-300 z-50';
            toast.innerHTML = `<i class="fas fa-check-circle text-green-400"></i> ${message}`;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 3000);
        }
    </script>
</body>
</html>
